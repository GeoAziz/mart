name: Scheduled CAQG Analytics Audit

on:
  schedule:
    # Runs daily at 04:00 UTC (07:00 EAT)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      property_filter:
        description: 'Property key to audit (leave empty for all enabled)'
        required: false
        default: 'mart_ke'
      dry_run:
        description: 'Execute without saving reports or opening issues'
        type: boolean
        required: false
        default: false

concurrency:
  group: caqg-report-publishing
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run-quality-gate:
    name: CAQG Analytics Audit (mart-ke)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install CAQG dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r caqg/requirements.txt

      - name: Configure Google Credentials
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > serviceAccountKey.json
            chmod 600 serviceAccountKey.json
          else
            echo "::error::FIREBASE_SERVICE_ACCOUNT_KEY secret is missing!"
            exit 1
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Run CAQG Quality Gate Pipeline
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./serviceAccountKey.json
          PYTHONPATH: caqg/src
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.property_filter }}" ]; then
            EXTRA_ARGS="--property ${{ github.event.inputs.property_filter }}"
          else
            EXTRA_ARGS="--property mart_ke"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi

          python3 -m caqg.orchestration.runner $EXTRA_ARGS

      - name: Clean up service account key
        if: always()
        run: rm -f serviceAccountKey.json

      - name: Commit and Push Versioned Reports
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add caqg/reports/
          if git diff --staged --quiet; then
            echo "No new report snapshots to commit."
          else
            git commit -m "chore(analytics): record CAQG historical report snapshots [skip ci]"
            # Pull with rebase to ensure clean linear history
            git pull --rebase origin main || true
            git push origin main
          fi

