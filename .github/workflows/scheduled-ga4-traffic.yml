name: Scheduled GA4 Synthetic Traffic (DEACTIVATED)

# DEACTIVATED: Scheduled synthetic traffic to production is permanently disabled
# to prevent GA4 cohort pollution and retention distortion.
# See Marketplace Activity Engine (MAE) Architecture Spec v3.0.

on:
  # schedule:
  #   - cron: '0 6 * * *' # DEACTIVATED
  workflow_dispatch:
    inputs:
      user_count:
        description: 'Number of synthetic users to simulate (Requires emulator/sim project)'
        required: false
        default: '5'

concurrency:
  group: scheduled-ga4-traffic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate-analytics:
    name: Generate GA4 Traffic & Purchases (mart-ke)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Firebase Service Account
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > serviceAccountKey.json
          else
            echo "::error::FIREBASE_SERVICE_ACCOUNT_KEY secret is not set!"
            exit 1
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Run Multi-User Shopping & GA4 Simulation
        env:
          NODE_ENV: development
          ENABLE_ANONYMOUS_CLIENT_FALLBACK: 'true'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'mart-ke'
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          FIREBASE_PROJECT_ID: 'mart-ke'
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
          SIMULATION_USER_COUNT: ${{ github.event.inputs.user_count || '45' }}
        run: npm run sim:shopping

      - name: Dispatch Offline Conversions (Measurement Protocol)
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
        run: npm run sim:offline-conversions

      - name: Generate Non-Google Ad Cost Data (Simulation Unlocker)
        run: npm run sim:cost-data

      - name: Archive Cost Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ga4-cost-data-csv
          path: data/ga4_cost_data.csv
          retention-days: 7

      - name: Clean up sensitive files
        if: always()
        run: rm -f serviceAccountKey.json
