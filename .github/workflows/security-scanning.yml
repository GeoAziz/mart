name: Image & Dependency Scanning

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Set lower case repository name
        run: |
          echo "IMAGE_REPO=$(echo "${{ github.repository_owner }}/nextn" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }} .
          docker tag ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }} ghcr.io/${{ env.IMAGE_REPO }}:latest

      - name: Run Trivy vulnerability scanner (Docker)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-docker.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Docker results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-docker.sarif'
          category: 'trivy-docker'

      - name: Upload Trivy Filesystem results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-fs'

      - name: Check for critical vulnerabilities
        run: |
          # Fail if critical vulnerabilities found
          if grep -q '"severity":"CRITICAL"' trivy-docker.sarif; then
            echo "❌ CRITICAL vulnerabilities found in Docker image!"
            exit 1
          fi
          echo "✅ No critical vulnerabilities found"

  snyk-scan:
    runs-on: ubuntu-latest
    if: false  # Disabled: SNYK_TOKEN secret is not configured
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk test
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'snyk.sarif'

  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'mart'
          path: '.'
          format: 'SARIF'
          out: 'reports'
          args: >
            --enableExperimental
            --exclude node_modules
            --exclude tests

      - name: Upload OWASP results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: './reports/dependency-check-report.sarif'

  sbom-generation:
    runs-on: ubuntu-latest
    needs: scan
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Set lower case repository name
        run: |
          echo "IMAGE_REPO=$(echo "${{ github.repository_owner }}/nextn" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build local Docker image for SBOM
        run: |
          docker build -t ghcr.io/${{ env.IMAGE_REPO }}:latest .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0.18.0
        with:
          image: ghcr.io/${{ env.IMAGE_REPO }}:latest
          format: spdx-json
          output-file: sbom-spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-spdx.json

  report:
    runs-on: ubuntu-latest
    needs: [scan, dependency-check, sbom-generation]
    if: always()
    permissions:
      contents: read
      checks: write

    steps:
      - name: Create scan summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trivy**: Image and filesystem scanned" >> $GITHUB_STEP_SUMMARY
          echo "- **Snyk**: Dependency vulnerabilities scanned (optional/skipped)" >> $GITHUB_STEP_SUMMARY
          echo "- **OWASP Dependency-Check**: Component vulnerabilities scanned" >> $GITHUB_STEP_SUMMARY
          echo "- **Syft**: SBOM generated" >> $GITHUB_STEP_SUMMARY

      - name: Check scan results
        if: needs.scan.result == 'failure' || needs.dependency-check.result == 'failure'
        run: exit 1
