name: Marketplace Activity Engine (MAE) Simulator

# MAE Orchestrator: Scheduled Synthetic Marketplace Simulation
# Runs daily on mart-ke with strict synthetic isolation and simulated payments.
# Populates both Firestore (is_synthetic: true) and GA4 (Drive Sales & Generate Leads).

on:
  schedule:
    # Daily at 03:00 UTC (06:00 EAT Africa/Nairobi)
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        type: choice
        options:
          - execute
          - dry-run
        default: execute
      date:
        description: 'Reporting date (YYYY-MM-DD)'
        required: false
      customer_limit:
        description: 'Max customers to schedule'
        required: false
        default: '5'
      vendor_limit:
        description: 'Max vendors to schedule'
        required: false
        default: '5'

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-simulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulate:
    name: Execute Marketplace Simulation (mart-ke)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Firebase Service Account
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > serviceAccountKey.json
            chmod 600 serviceAccountKey.json
          else
            echo "::error::FIREBASE_SERVICE_ACCOUNT_KEY secret is required!"
            exit 1
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Validate Simulation Environment Guard
        run: npm run simulator:guard
        env:
          NODE_ENV: development
          ALLOW_MART_KE_SIMULATION: 'true'
          FIREBASE_PROJECT_ID: 'mart-ke'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'mart-ke'
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          PAYMENT_PROVIDER_MODE: 'simulated'

      - name: Execute Marketplace Activity Engine (MAE)
        run: |
          FLAGS=""
          if [ "${{ inputs.mode }}" = "dry-run" ]; then
            FLAGS="--dry-run"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            FLAGS="$FLAGS --date=${{ inputs.date }}"
          fi
          FLAGS="$FLAGS --customers=${{ inputs.customer_limit || '5' }} --vendors=${{ inputs.vendor_limit || '5' }}"
          npm run simulator:run -- $FLAGS
        env:
          NODE_ENV: development
          ALLOW_MART_KE_SIMULATION: 'true'
          FIREBASE_PROJECT_ID: 'mart-ke'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'mart-ke'
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
          PAYMENT_PROVIDER_MODE: 'simulated'

      - name: Clean up sensitive credentials
        if: always()
        run: rm -f serviceAccountKey.json
