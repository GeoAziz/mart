name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        test-suite:
          - smoke
          - e2e
          - integration
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Start Firebase emulators
        run: |
          npx --yes firebase-tools@13.29.2 emulators:start --only auth,firestore --project demo-zilacart > /tmp/firebase-emulator.log 2>&1 &
          echo $! > /tmp/firebase-emulator.pid
          for i in {1..90}; do
            if curl --silent --show-error --max-time 2 http://127.0.0.1:8080/ -o /dev/null &&
               curl --silent --show-error --max-time 2 http://127.0.0.1:9099/ -o /dev/null; then
              echo "Firebase emulators are ready"
              exit 0
            fi
            echo "Waiting for Firebase emulators... ($i/90)"
            sleep 2
          done
          echo "Firebase emulators did not become ready in time"
          tail -n 200 /tmp/firebase-emulator.log
          exit 1
      
      - name: Start dev server
        env:
          FIREBASE_PROJECT_ID: demo-zilacart
          FIREBASE_STORAGE_BUCKET: demo-zilacart.appspot.com
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: |
          npm run dev > /tmp/next-dev.log 2>&1 &
          echo $! > /tmp/next-dev.pid
        timeout-minutes: 5
      
      - name: Wait for server
        run: |
          for i in {1..60}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Server ready (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "⏳ Waiting for server... ($i/60, HTTP $HTTP_CODE)"
            sleep 2
          done
          echo "❌ Server did not become ready in time"
          echo "---- Last 200 lines of Next.js log ----"
          tail -n 200 /tmp/next-dev.log || true
          exit 1
      
      - name: Run ${{ matrix.test-suite }} tests
        run: |
          python -m pytest tests/test_master.py -m ${{ matrix.test-suite }} --collect-only -q > /tmp/collect-${{ matrix.test-suite }}.log 2>&1 || true
          if grep -qE "no tests (ran|collected)" /tmp/collect-${{ matrix.test-suite }}.log; then
            echo "No tests match marker '${{ matrix.test-suite }}' — skipping"
            exit 0
          fi
          python -m pytest tests/test_master.py -m ${{ matrix.test-suite }} -v --tb=short --html=report.html --self-contained-html
        env:
          BASE_URL: http://localhost:3000
          HEADLESS: 'true'
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.test-suite }}
          path: report.html
          if-no-files-found: ignore
      
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.test-suite }}
          path: tests/reports/screenshots/
          if-no-files-found: ignore
