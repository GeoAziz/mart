[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caqg"
version = "0.3.0"
description = "Commerce Analytics Quality Gate (CAQG) for GA4 & E-commerce Reconciliation"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Kernel Ghost", email = "agencyhajjo@gmail.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "google-analytics-data>=0.18.0",
    "google-auth>=2.29.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

