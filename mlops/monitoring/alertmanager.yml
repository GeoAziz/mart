global:
  resolve_timeout: 5m

route:
  receiver: 'default-receiver'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - match:
        severity: 'critical'
      receiver: 'slack-critical'
      continue: true
    - match:
        severity: 'warning'
      receiver: 'slack-warning'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/'
        send_resolved: true

  - name: 'slack-critical'
    # Configure Slack webhook via GitHub Secret:
    # 1. Create a Slack Incoming Webhook at https://api.slack.com/apps
    # 2. Store in GitHub Secret: SLACK_CRITICAL_WEBHOOK_URL
    # 3. Inject at deploy: kubectl create secret generic alertmanager-slack \
    #      --from-literal=critical-url="<webhook-url>"
    slack_configs:
      - api_url: '{{ env "SLACK_CRITICAL_WEBHOOK_URL" }}'
        channel: '#alerts-critical'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'

  - name: 'slack-warning'
    slack_configs:
      - api_url: '{{ env "SLACK_WARNING_WEBHOOK_URL" }}'
        channel: '#alerts-warning'
        send_resolved: false
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'

# Setup instructions:
# In production, inject webhook URLs via environment variables or Kubernetes secrets.
# Do NOT commit real webhook URLs to the repository. Use GitHub Actions secrets.
# For local testing, mock the webhook receiver or disable Slack notifcations.
