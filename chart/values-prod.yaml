# Production environment values
# EKS cluster with high availability

replicaCount: 3

image:
  repository: 123456789.dkr.ecr.us-east-1.amazonaws.com/mart-app
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-pull-secret

env:
  NODE_ENV: production
  LOG_LEVEL: warn

# Firebase (Cloud Firestore)
firebase:
  enabled: true
  emulator:
    enabled: false

# Real AWS services
aws:
  enabled: true
  region: us-east-1
  s3:
    bucket: mart-production-uploads
  dynamodb:
    region: us-east-1
  sqs:
    region: us-east-1

# Redis (AWS ElastiCache)
redis:
  enabled: true
  host: redis.production.cache.amazonaws.com
  port: 6379
  auth:
    enabled: true
    password: ${REDIS_PASSWORD}

# Prometheus for monitoring
prometheus:
  enabled: true
  scrapeInterval: 30s
  retention: 30d
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: gp3

# Grafana dashboards
grafana:
  enabled: true
  adminPassword: ${GRAFANA_PASSWORD}
  persistence:
    enabled: true
    size: 10Gi
    storageClass: gp3

# WebSocket server
websocket:
  enabled: true
  replicaCount: 3
  env:
    NODE_ENV: production

# Queue workers - production scale
queueWorkers:
  enabled: true
  orders:
    replicas: 2
  products:
    replicas: 2
  payments:
    replicas: 2
  notifications:
    replicas: 1

# Ingress for production
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.zilamart.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: prod-tls
      hosts:
        - api.zilamart.com

# Production resources
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

# Aggressive autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# Service
service:
  type: LoadBalancer
  port: 443
  targetPort: 3000
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Network policies
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
  egress:
    - to:
        - namespaceSelector: {}

# Affinity for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - zilamart
          topologyKey: kubernetes.io/hostname

# Health checks
livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

# Secrets (injected at deploy time)
secretsManager:
  enabled: true
  backend: aws-secrets-manager
  projectId: zilamart-prod
