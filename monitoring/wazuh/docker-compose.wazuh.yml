version: '3.8'

services:
  wazuh-manager:
    image: wazuh/wazuh-manager:latest
    ports:
      - "55000:55000"
      - "1514:1514"
      - "1515:1515"
    volumes:
      - wazuh-manager-data:/var/ossec/data
    environment:
      - INDEXER_URL=http://wazuh-indexer:9200
    restart: unless-stopped

volumes:
  wazuh-manager-data:
