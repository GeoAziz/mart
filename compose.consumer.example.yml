version: '3.8'

networks:
  mart-network:
    external: true
    name: mart-network

services:
  my-app:
    image: my-app:dev
    networks:
      - mart-network
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
